# Publishes to npm when a merge to master changes package.json to a version
# that is not on npm yet. Release = a PR that bumps "version".
#
# Uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed.
# npm side: package settings > Trusted publisher > GitHub Actions,
# workflow filename "publish.yml".
name: Publish

on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write # create the vX.Y.Z tag and GitHub release
  id-token: write # npm trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check whether this version is already published
        id: version
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm 11.5.1 or later
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@latest

      - if: steps.version.outputs.publish == 'true'
        run: npm ci

      - if: steps.version.outputs.publish == 'true'
        run: npm test

      - if: steps.version.outputs.publish == 'true'
        run: npm publish --access public

      - name: Create tag and GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
